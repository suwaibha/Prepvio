name: Build and Push Main Frontend Docker Image

on:
  push:
    branches:
      - main
      - development
    paths:
      - "Frontend/prepvio/**"
      - ".github/workflows/docker-main-frontend.yml"

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend/prepvio
          file: ./Frontend/prepvio/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/prepvio-main-frontend:latest
          build-args: |
            VITE_MAIN_API_URL=https://prepvio-main-back-892382638275.europe-west1.run.app/api
            VITE_CONTENT_API_URL=https://prepvio-admin-back-892382638275.europe-west1.run.app/api
            VITE_MAIN_BACKEND_URL=https://prepvio-main-back-892382638275.europe-west1.run.app
            VITE_CONTENT_BACKEND_URL=https://prepvio-admin-back-892382638275.europe-west1.run.app
            VITE_SOCKET_URL=https://prepvio-main-back-892382638275.europe-west1.run.app
